spring.application.name=blindtest
server.port=4673

spring.datasource.url=jdbc:sqlite:data/blindtest.db?foreign_keys=on
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Rythme minimum entre deux requêtes vers un hôte externe (KHInsider, le CDN audio)
khinsider.request-delay-ms=1000
# Fréquence du balayage qui vérifie et rafraîchit les liens audio
khinsider.refresh-interval=7d
