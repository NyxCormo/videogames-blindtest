spring.application.name=blindtest
server.port=4673
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

spring.datasource.url=jdbc:sqlite:data/blindtest.db?foreign_keys=on
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.compression.enabled=true

# Rythme minimum entre deux requêtes vers un hôte externe (KHInsider, le CDN audio)
khinsider.request-delay-ms=1000
# Fréquence du balayage qui vérifie et rafraîchit les liens audio
khinsider.refresh-interval=1d
# Attente avant le premier balayage après le démarrage, pour ne pas tout revérifier à chaque redémarrage
khinsider.refresh-initial-delay=1h

# Dossier des images de jeux téléchargées (ignoré par git, comme la base)
covers.directory=data/covers
# Dossier des pages d'album KHInsider envoyées par le navigateur (ignoré par git)
khinsider.pages-directory=data/khinsider-pages

# Audios YouTube téléchargés par le code privé (dossier private/ à côté du dépôt), ignorés par git
youtube.audio-directory=data/youtube-audio
youtube.max-file-size-mb=50

# Mot de passe du compte admin, lu dans backend/.env 
spring.config.import=optional:file:.env[.properties]
admin.password=${ADMIN_PASSWORD:}
# Jeton du script qui envoie les pages d'album KHInsider ouvertes dans le navigateur, lu dans backend/.env (vide : import désactivé)
khinsider.import-token=${IMPORT_TOKEN:}
# Pas d'utilisateur par défaut : le seul compte est l'admin ci-dessus
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
